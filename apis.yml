name: Bionic Stork
description: 'Bionic Stork Ltd. (operating as Bionic, bionic.ai) was an Application
  Security Posture Management (ASPM) company founded in Tel Aviv, Israel. Its agentless
  platform mapped application architectures in production — services, APIs, dependencies,
  data flows and SBOMs — to surface and prioritize security, data-privacy and operational
  risk for cloud-native applications. Backed by Insight Partners, Cyberstarts and
  Battery Ventures (including a $65M Series B), Bionic was acquired by CrowdStrike
  in 2023 for a reported ~$350M and folded into CrowdStrike Falcon ASPM. bionic.ai
  now 301-redirects to CrowdStrike and the company has no independent public developer
  API, SDK, or documentation surface.'
